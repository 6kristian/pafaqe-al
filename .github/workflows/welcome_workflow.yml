name: Send Welcome Emails

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  send-emails:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-genai resend

      - name: Run welcome email script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python send_welcomes.py

      - name: Commit cleared queue back to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated: Processed welcome email queue"
          file_pattern: users_queue.json
