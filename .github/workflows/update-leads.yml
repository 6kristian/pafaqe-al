name: Weekly refresh (CSS + leads)

on:
  schedule:
    - cron: '0 0 * * 0' # every Sunday at midnight UTC
  workflow_dispatch: # manual run from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile production CSS
        run: |
          npm install tailwindcss @tailwindcss/cli
          npx @tailwindcss/cli -i ./input.css -o ./output.css --minify

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests firebase-admin

      - name: Collect, clean and upload leads
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python osm_collector.py
          python clean_leads.py leads.raw.json
          python upload_leads.py

      - name: Commit CSS and public preview only
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add output.css leads-preview.json
          git diff --staged --quiet || (git commit -m "Auto: rebuild CSS and refresh preview [skip ci]" && git push)
