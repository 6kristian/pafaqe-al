name: Auto-Build CSS & Collect Leads

on:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at midnight
  workflow_dispatch: # Allows manual trigger anytime from GitHub

jobs:
  build-and-scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for Tailwind CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile Production CSS
        run: |
          npm install tailwindcss @tailwindcss/cli
          npx @tailwindcss/cli -i ./input.css -o ./output.css --minify

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install requests

      - name: Run Collector Script
        run: python osm_collector.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add output.css leads.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-compile CSS & update leads [skip ci]" && git push)
